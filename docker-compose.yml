services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - quizly-mongo:/data/db

  quizly:
    build: .
    restart: unless-stopped
    depends_on:
      - mongo
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/quizapp
    ports:
      - "4000:4000"

volumes:
  quizly-mongo:
